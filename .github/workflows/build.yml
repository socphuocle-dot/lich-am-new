# Tự động mỗi lần đẩy mã lên main (và mỗi Pull Request):
#   kiểm thử (mã + bấm thử giao diện + trợ năng) → build APK/AAB (Android) + IPA (iOS) → kiểm tra Android Lint
#   → đưa bản web lên GitHub Pages.
# Khi gắn tag phiên bản (vd. v1.15.0): tạo trang tải về cố định trên GitHub Releases;
#   nếu đã cài Secret PLAY_SERVICE_ACCOUNT_JSON thì tự đẩy bản AAB lên Google Play (kênh thử nghiệm nội bộ).
name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/LichAm-NhacGio.apk
  VITE_APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/LichAm-NhacGio.apk
  VITE_REPO: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Kiểm thử mã (vitest)
        run: npm test
      - name: Build bản web
        run: npm run build
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Cài trình duyệt kiểm thử
        run: |
          pip install playwright==1.*
          python -m playwright install --with-deps chromium
      - name: Bấm thử giao diện (40 kịch bản)
        run: python tests/e2e.py dist test-shots
      - name: Kiểm tra trợ năng (cỡ chữ, tương phản, nhãn đọc màn hình)
        run: python tests/a11y.py dist test-shots
      - name: Lưu ảnh chụp màn hình khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: test-shots, path: test-shots, if-no-files-found: ignore }

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - name: Lấy khóa ký từ GitHub Secrets
        id: keys
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Pull Request: không có khóa ký → chỉ build bản thử (debug) để kiểm tra biên dịch"
              echo "signed=0" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::Chưa có Secret ANDROID_KEYSTORE_BASE64 — xem HUONG-DAN-PHAT-HANH.md bước 3"
            exit 1
          fi
          echo "signed=1" >> "$GITHUB_OUTPUT"
          echo "$KS_B64" | tr -d ' \r\n\t' | base64 -d > android/app/release.jks
          KS_PASS=$(printf %s "$KS_PASS" | tr -d '\r\n')
          printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=lichamnhacgio\nkeyPassword=%s\n" "$KS_PASS" "$KS_PASS" > android/keystore.properties
      # APK tải trực tiếp: có mã QR ủng hộ + tự báo bản mới
      - name: Build thử (Pull Request, không ký)
        if: steps.keys.outputs.signed == '0'
        run: |
          npm run build
          npx cap sync android
          cd android && chmod +x gradlew
          for i in 1 2 3; do ./gradlew --no-daemon assembleDebug && break; [ $i = 3 ] && exit 1; echo "Thử lại sau 60 giây..."; sleep 60; done
      - name: Build APK (bản tải trực tiếp)
        if: steps.keys.outputs.signed == '1'
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
        run: |
          npm run build
          npx cap sync android
          cd android && chmod +x gradlew
          # Thử lại tối đa 3 lần nếu kho thư viện Maven báo quá tải (lỗi 429)
          for i in 1 2 3; do ./gradlew --no-daemon assembleRelease && break; [ $i = 3 ] && exit 1; echo "Thử lại sau 60 giây..."; sleep 60; done
          mkdir -p ../out && cp app/build/outputs/apk/release/app-release.apk ../out/LichAm-NhacGio.apk
      # AAB cho Google Play: ẩn mã QR (chính sách cửa hàng), cập nhật qua Play
      - name: Build AAB (Google Play)
        if: steps.keys.outputs.signed == '1'
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
          VITE_CHANNEL: store
        run: |
          npm run build
          npx cap sync android
          cd android
          for i in 1 2 3; do ./gradlew --no-daemon bundleRelease && break; [ $i = 3 ] && exit 1; echo "Thử lại sau 60 giây..."; sleep 60; done
          cp app/build/outputs/bundle/release/app-release.aab ../out/LichAm-NhacGio-GooglePlay.aab
      # Android Lint: bắt lỗi widget (view không được phép trong widget…), quyền, giao diện. Không chặn bản build,
      # nhưng in số lỗi ra trang tóm tắt và lưu báo cáo để xem.
      - name: Android Lint
        continue-on-error: true
        run: |
          cd android && ./gradlew --no-daemon lintDebug
      - name: Tóm tắt Lint
        if: always()
        run: |
          R=android/app/build/reports/lint-results-debug.xml
          if [ -f "$R" ]; then
            E=$(grep -c 'severity="Error"' "$R" || true); W=$(grep -c 'severity="Warning"' "$R" || true)
            echo "### Android Lint: $E lỗi, $W cảnh báo" >> "$GITHUB_STEP_SUMMARY"
            grep -o 'id="[A-Za-z]*"[^>]*severity="Error"[^>]*message="[^"]*"' "$R" | head -20 | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
            [ "$E" = "0" ] || echo "::warning::Android Lint có $E lỗi — xem artifact lint-report"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lint-report, path: android/app/build/reports/lint-results-debug.*, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: steps.keys.outputs.signed == '1'
        with: { name: android, path: out/* }
      # Tự đẩy lên Google Play khi gắn tag (chỉ khi đã cài Secret PLAY_SERVICE_ACCOUNT_JSON — xem HUONG-DAN-GOOGLE-PLAY.md)
      - name: Kiểm tra Secret Google Play
        id: play
        if: steps.keys.outputs.signed == '1' && startsWith(github.ref, 'refs/tags/v')
        env: { PLAY_JSON: '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' }
        run: echo "ok=$([ -n "$PLAY_JSON" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Đẩy AAB lên Google Play
        if: steps.play.outputs.ok == '1'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: vn.lichamnhacgio.app
          releaseFiles: out/LichAm-NhacGio-GooglePlay.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'draft' }}
          releaseName: ${{ github.ref_name }}
          whatsNewDirectory: store/whatsnew

  ios:
    needs: test
    # Máy Mac của GitHub hay thiếu chỗ (báo "not acquired by Runner"): chỉ build iPhone khi gắn tag phát hành,
    # khi bấm chạy tay (Actions → Build & Publish → Run workflow) hoặc ở Pull Request — không build mỗi lần đẩy mã.
    # Bị hủy vì thiếu máy: vào lần chạy → Re-run jobs → Re-run failed jobs.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    # Bản iOS lỗi không chặn bản Android (APK vẫn phát hành); lỗi vẫn hiện để biết mà sửa
    continue-on-error: true
    env:
      # Bản iPhone theo quy định App Store: không mã QR chuyển khoản, không link tải APK, ẩn tab Văn hóa mặc định
      VITE_CHANNEL: store
      VITE_CULTURE: 'off'
      VITE_APPSTORE_ID: ${{ vars.APPSTORE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Apple bắt buộc build bằng Xcode 26 / iOS 26 SDK trở lên (từ 28/4/2026)
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Kiểm tra phiên bản Xcode
        run: |
          xcodebuild -version
          V=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          [ "$V" -ge 26 ] || { echo "::error::Cần Xcode 26 trở lên (đang là $V)"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Số phiên bản
        id: ver
        run: |
          echo "marketing=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Kiểm tra khóa Apple (App Store Connect API)
        id: asc
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            mkdir -p ~/private_keys
            printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "Chưa có khóa Apple → chỉ build bản chưa ký (.ipa) để kiểm tra biên dịch. Xem HUONG-DAN-IOS.md"
            echo "signed=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build .ipa (chưa ký)
        if: steps.asc.outputs.signed == '0'
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=${{ steps.ver.outputs.marketing }} CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee xcodebuild.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log || { grep -E "error:" xcodebuild.log | head -30; exit 1; }
          mkdir -p Payload out
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry out/LichAm-NhacGio-unsigned.ipa Payload
      - name: Ký và gửi lên TestFlight
        if: steps.asc.outputs.signed == '1'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$ASC_KEY_ID.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=${{ steps.ver.outputs.marketing }} CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }} \
            $AUTH archive | tee xcodebuild.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" xcodebuild.log || { grep -E "error:" xcodebuild.log | head -30; exit 1; }
          # Tùy chọn xuất: gửi thẳng lên App Store Connect (TestFlight)
          plutil -create xml1 ExportOptions.plist
          plutil -insert method -string app-store-connect ExportOptions.plist
          plutil -insert destination -string upload ExportOptions.plist
          plutil -insert teamID -string "$APPLE_TEAM_ID" ExportOptions.plist
          plutil -insert signingStyle -string automatic ExportOptions.plist
          plutil -insert uploadSymbols -bool true ExportOptions.plist
          plutil -insert manageAppVersionAndBuildNumber -bool false ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export $AUTH
          echo "### Đã gửi bản ${{ steps.ver.outputs.marketing }} (${{ steps.ver.outputs.build }}) lên TestFlight — Apple xử lý 10–30 phút" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.asc.outputs.signed == '0'
        with: { name: ios, path: out/*.ipa }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: ios-build-log, path: xcodebuild.log, if-no-files-found: ignore }

  # Bản web chạy ngay trên trình duyệt: https://<tên-tài-khoản>.github.io/<tên-kho>/
  web:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # actions: read — deploy-pages cần quyền đọc artifact để tìm gói 'github-pages' (thiếu quyền này sẽ báo 'Found 0 artifact')
    permissions: { pages: write, id-token: write, actions: read, contents: read }
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { VITE_APK_URL: '${{ env.APK_URL }}' }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4

  # Gắn tag v1.0.0, v1.0.1… → tạo bản phát hành có link tải cố định
  release:
    needs: [android, ios]
    # Vẫn phát hành APK nếu bản iOS lỗi
    if: always() && needs.android.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: Lịch Âm & Nhắc Giỗ ${{ github.ref_name }}
          files: files/*
          body: |
            **Android:** tải `LichAm-NhacGio.apk` → mở file → cho phép cài từ nguồn này → Cài đặt.
            **iPhone:** dùng bản web (mở link trang web → Chia sẻ → Thêm vào MH chính), hoặc cài `LichAm-NhacGio-unsigned.ipa` bằng Sideloadly.
            Link tải luôn trỏ tới bản mới nhất: ${{ env.APK_URL }}
